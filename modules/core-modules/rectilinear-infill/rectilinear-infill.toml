[module]
id           = "com.core.rectilinear-infill"
version      = "0.1.0"
display-name = "Rectilinear Infill"
description  = "Core rectilinear infill module"
author       = "modular-slicer"
license      = "MIT"

[stage]
id = "Layer::Infill"

[ir-access]
reads  = ["SliceIR"]
writes = ["InfillIR"]

[claims]
# Packet 37's four granular fill-role claims supersede the legacy
# `infill-generator` blanket claim. Retired 2026-06-09 (see DEV-065) so
# multiple infill modules can coexist; per-region resolution via
# `ResolvedConfig.{top,bottom,bridge,sparse}_fill_holder` selects which
# module emits each role per region.
holds = [
    "claim:top-fill",
    "claim:bottom-fill",
    "claim:bridge-fill",
    "claim:sparse-fill",
]
requires = []

[compatibility]
incompatible-with = []
requires          = []
min-host-version  = "0.1.0"
min-ir-schema     = "1.0.0"
max-ir-schema     = "5.0.0"

[config.schema]
[config.schema.sparse_infill_density]
type    = "float"
default = 20.0
min     = 0.0
max     = 100.0
display = "Sparse Infill Density"
group   = "Infill"

[config.schema.infill_direction]
type    = "float"
default = 45.0
min     = 0.0
max     = 360.0
display = "Infill Direction"
group   = "Infill"

[config.schema.sparse_infill_speed]
type    = "float"
default = 100.0
min     = 1.0
max     = 300.0
display = "Sparse Infill Speed"
group   = "Infill"

[config.schema.top_surface_speed]
type    = "float"
default = 60.0
min     = 1.0
max     = 300.0
display = "Top Surface Speed"
group   = "Infill"

[config.schema.internal_solid_infill_speed]
type    = "float"
default = 60.0
min     = 1.0
max     = 300.0
display = "Internal Solid Infill Speed"
group   = "Infill"

[config.schema.line_width]
type    = "float"
default = 0
min     = 0.0
max     = 2.0
display = "Line Width"
group   = "Infill"

[config.schema.initial_layer_line_width]
type    = "float"
default = 0.0
min     = 0.0
max     = 2.0
display = "Initial Layer Line Width"
group   = "Infill"

[config.schema.bridge_line_width]
type    = "float"
default = 0.0
min     = 0.0
max     = 2.0
display = "Bridge Line Width"
group   = "Infill"

[config.schema.bridge_density]
type    = "float_or_percent"
default = "100%"
min     = 10.0
max     = 120.0
display = "Bridge Density"
group   = "Infill"

[config.schema.bridge_flow]
type    = "float"
default = 1.0
min     = 0.0
display = "Bridge Flow"
group   = "Infill"

[config.schema.thick_bridges]
type    = "bool"
default = false
display = "Thick Bridges"
group   = "Infill"

[config.schema.bridge_speed]
type    = "float"
default = 25.0
min     = 1.0
max     = 300.0
display = "Bridge Speed"
group   = "Infill"

[config.schema.internal_bridge_density]
type    = "float_or_percent"
default = "100%"
min     = 10.0
max     = 125.0
display = "Internal Bridge Density"
group   = "Infill"

[config.schema.internal_bridge_flow]
type    = "float"
default = 1.0
min     = 0.0
display = "Internal Bridge Flow"
group   = "Infill"

[config.schema.thick_internal_bridges]
type    = "bool"
default = true
display = "Thick Internal Bridges"
group   = "Infill"

[config.schema.internal_bridge_speed]
type    = "float_or_percent"
default = "150%"
min     = 1.0
display = "Internal Bridge Speed"
group   = "Infill"

[config.schema.internal_bridge_angle]
type    = "float"
default = 0.0
min     = 0.0
max     = 180.0
display = "Internal Bridge Angle"
group   = "Infill"

[config.schema.dont_filter_internal_bridges]
type    = "bool"
default = false
display = "Do Not Filter Internal Bridges"
group   = "Infill"

[config.schema.enable_extra_bridge_layer]
type    = "bool"
default = false
display = "Enable Extra Bridge Layer"
group   = "Infill"

[config.schema.sparse_infill_line_width]
type    = "float"
default = 0.0
min     = 0.0
max     = 2.0
display = "Sparse Infill Line Width"
group   = "Infill"

[config.schema.internal_solid_infill_line_width]
type    = "float"
default = 0.0
min     = 0.0
max     = 2.0
display = "Internal Solid Infill Line Width"
group   = "Infill"

[config.schema.top_surface_line_width]
type    = "float"
default = 0.0
min     = 0.0
max     = 2.0
display = "Top Surface Line Width"
group   = "Infill"

[config.overridable-per-region]
keys = []

[config.overridable-per-layer]
keys = []

[hints]
estimated-ms-per-layer = 10
layer-parallel-safe    = true

[package]
name = "path-optimization-default"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Default path-optimization core module implementing LayerModule for the Layer::PathOptimization stage"

[features]
# Empty selection feature (default off); gates the crate-internal
# src/property_tests.rs unit-test module. Never enters a production or
# guest graph: also #[cfg(test)]-gated, and the property engine is a
# dev-dependency only.
property_testing = []

[dependencies]
slicer-sdk = { path = "../../../crates/slicer-sdk" }
slicer-schema = { path = "../../../crates/slicer-schema" }
slicer-ir = { path = "../../../crates/slicer-ir" }
slicer-core = { path = "../../../crates/slicer-core" }

# Required by the `#[slicer_module]` macro's wasm32-only component export
# glue. On native builds the emitted `wit_bindgen::generate!` call is
# gated behind `#[cfg(target_arch = "wasm32")]` and never expanded, so
# wit-bindgen is only pulled into the dependency graph when compiling
# this crate for the `wasm32-unknown-unknown` target via the companion
# `wit-guest/` subcrate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[dev-dependencies]
slicer-sdk = { path = "../../../crates/slicer-sdk", features = ["test", "property_testing"] }
proptest = { workspace = true }

[lints]
workspace = true

[module]
id           = "com.core.fuzzy-skin"
version      = "0.1.0"
display-name = "Fuzzy Skin"
description  = "Core fuzzy skin module"
author       = "modular-slicer"
license      = "MIT"

[stage]
id = "Layer::PerimetersPostProcess"

[ir-access]
reads  = ["PerimeterIR"]
writes = ["PerimeterIR"]

[claims]
holds    = []
requires = []

[compatibility]
incompatible-with = []
requires          = []
min-host-version  = "0.1.0"
min-ir-schema     = "1.0.0"
max-ir-schema     = "5.0.0"

[config.schema]
[config.schema.thickness]
type    = "float"
default = 0.3
min     = 0.0
max     = 2.0
display = "Fuzzy Skin Thickness"
group   = "Fuzzy Skin"

[config.schema.point_distance]
type    = "float"
default = 0.5
min     = 0.01
max     = 5.0
display = "Point Distance"
group   = "Fuzzy Skin"

[config.schema.apply_to_all]
type    = "bool"
default = false
display = "Apply to All Walls"
group   = "Fuzzy Skin"

# Region-split activation. `fuzzy_skin` is declared so the aggregate knows the
# semantic and painted fuzzy-skin regions get a variant chain. `paint_only` is
# deliberately absent (defaults to false) and MUST STAY ABSENT: run_wall_postprocess
# gates on `apply_to_all || wall.feature_flags.fuzzy_skin`, so a manifest that
# declared paint_only would skip fuzzy-skin on unpainted layers whenever
# `apply_to_all = true` — exactly the mode users rely on. Fuzzy-skin therefore
# stays dispatch-transparent and runs on every layer; per-wall/per-feature
# gating remains module-internal. See ADR-0071.
[[region_split]]
semantic   = "fuzzy_skin"
priority   = 200
value_type = "flag"

[hints]
estimated-ms-per-layer = 10
layer-parallel-safe    = true

[module]
id           = "com.core.infill-linker"
version      = "0.1.0"
display-name = "Infill Linker"
description  = "Links raw infill segments into polylines per (region, role) with OrcaSlicer overlap semantics, with optional cross-region linking for wall-less sub-regions (ADR-0025/0026)."
author       = "modular-slicer"
license      = "MIT"

[stage]
id = "Layer::InfillPostProcess"

[ir-access]
reads  = ["InfillIR", "PerimeterIR", "RegionMapIR"]
writes = ["InfillIR"]

[claims]
holds    = ["claim:infill-link"]
requires = []

[compatibility]
incompatible-with = []
requires          = []
min-host-version  = "0.1.0"
min-ir-schema     = "3.0.0"
max-ir-schema     = "5.0.0"

[config.schema.infill_overlap]
type    = "float"
default = 0.45
min     = 0.0
max     = 1.0
display = "Infill Overlap (×spacing)"
group   = "InfillLinker"

[config.schema.infill_anchor]
type        = "float_or_percent"
default     = "400%"
min         = 0.0
max         = 1000.0
unit        = "mm"
display     = "Infill Anchor"
description = "Canonical default ConfigOptionFloatOrPercent(400, true); the parsed manifest default \"400%\" is threaded into the runtime ConfigView by scheduler schema-default injection, so get_abs_value resolves it against the extrusion-flow spacing base. AnchorParams::from_config's 4.0x base fallback applies when get_abs_value returns None — i.e. when infill_anchor is absent or non-numeric."
group       = "InfillLinker"

[config.schema.infill_anchor_max]
type        = "float_or_percent"
default     = 20.0
min         = 0.0
max         = 1000.0
unit        = "mm"
display     = "Maximum Infill Anchor"
description = "Canonical default ConfigOptionFloatOrPercent(20, false); the parsed manifest default is threaded into the runtime ConfigView by scheduler schema-default injection, so get_abs_value resolves the absolute 20.0 mm value. AnchorParams::from_config's 20.0 mm fallback applies when get_abs_value returns None — i.e. when infill_anchor_max is absent or non-numeric."
group       = "InfillLinker"

[config.schema.layer_height]
type        = "float"
default     = 0.2
min         = 0.01
max         = 2.0
unit        = "mm"
display     = "Layer height"
description = "Layer height used by the infill linker when resolving anchor-length percentages."
group       = "Quality"

[config.schema.line_width]
type    = "float"
default = 0.4
min     = 0.1
max     = 2.0
display = "Line Width"
group   = "Infill"

[config.overridable-per-region]
keys = []

[config.overridable-per-layer]
keys = []

[hints]
estimated-ms-per-layer = 30
layer-parallel-safe    = true

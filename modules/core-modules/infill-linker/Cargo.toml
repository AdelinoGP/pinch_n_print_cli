[package]
name = "infill-linker"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Infill linker module for the Layer::InfillPostProcess stage"

[dependencies]
slicer-sdk = { path = "../../../crates/slicer-sdk" }
slicer-schema = { path = "../../../crates/slicer-schema" }
slicer-ir = { path = "../../../crates/slicer-ir" }
slicer-core = { path = "../../../crates/slicer-core" }

[features]
# Empty selection feature (default off). It gates the crate-internal
# `src/property_tests.rs` unit-test module that exercises this module's
# graph/connector, connection-compatibility and chain-origin seams. It never
# enters a production or guest graph: the module is also `#[cfg(test)]`-gated,
# and the property engine is a dev-dependency only.
property_testing = []

[dev-dependencies]
slicer-sdk = { path = "../../../crates/slicer-sdk", features = ["test", "property_testing"] }
proptest = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[lints]
workspace = true

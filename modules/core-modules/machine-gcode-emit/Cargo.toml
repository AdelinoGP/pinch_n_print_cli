[package]
name = "machine-gcode-emit"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Machine start/end G-code emitter for GCodePostProcess stage"

[dependencies]
slicer-sdk = { path = "../../../crates/slicer-sdk" }
slicer-schema = { path = "../../../crates/slicer-schema" }
slicer-ir = { path = "../../../crates/slicer-ir" }

[features]
# Empty selection feature (default off); gates the crate-internal
# `src/property_tests.rs` unit-test module. Never enters a production or
# guest graph: the module is `#[cfg(test)]`-gated and the property engine is a
# dev-dependency only.
property_testing = []

[dev-dependencies]
slicer-sdk = { path = "../../../crates/slicer-sdk", features = ["test", "property_testing"] }
proptest = { workspace = true }
toml = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[lints]
workspace = true

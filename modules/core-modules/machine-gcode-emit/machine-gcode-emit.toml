[module]
id           = "com.core.machine-gcode-emit"
version      = "0.1.0"
display-name = "Machine G-code Emit"
description  = "Emits the eleven registered injection points machine_start_gcode, before_layer_change_gcode, time_lapse_gcode, layer_change_gcode, filament_end_gcode, change_filament_gcode, filament_start_gcode, change_extrusion_role_gcode, filament_change_extrusion_role_gcode, process_change_extrusion_role_gcode, and machine_end_gcode by inserting Raw commands into the GCodePostProcess stream after running [key] substitution against the effective ConfigView."
author       = "modular-slicer"
license      = "MIT"

[stage]
id = "PostPass::GCodePostProcess"

[ir-access]
reads  = ["GCodeIR"]
writes = ["GCodeIR"]

[claims]
holds    = []
requires = []

[compatibility]
incompatible-with = []
requires          = []
min-host-version  = "0.1.0"
min-ir-schema     = "1.0.0"
max-ir-schema     = "5.0.0"

[config.schema]

[config.schema.machine_start_gcode]
type    = "string"
default = """M190 S[bed_temperature_initial_layer_single]
M109 S[nozzle_temperature_initial_layer]
PRINT_START EXTRUDER=[nozzle_temperature_initial_layer] BED=[bed_temperature_initial_layer_single]"""
display = "Machine Start G-code"
group   = "Machine G-code"

[config.schema.machine_end_gcode]
type    = "string"
default = "PRINT_END"
display = "Machine End G-code"
group   = "Machine G-code"

[config.schema.before_layer_change_gcode]
type    = "string"
default = ""
group   = "Machine G-code"

[config.schema.layer_change_gcode]
type    = "string"
default = ""
group   = "Machine G-code"

[config.schema.time_lapse_gcode]
type    = "string"
default = ""
group   = "Machine G-code"

[config.schema.filament_end_gcode]
type    = "string"
default = ""
group   = "Machine G-code"

[config.schema.change_filament_gcode]
type    = "string"
default = ""
group   = "Machine G-code"

[config.schema.filament_start_gcode]
type    = "string"
default = ""
group   = "Machine G-code"

[config.schema.change_extrusion_role_gcode]
type    = "string"
default = ""
group   = "Machine G-code"

[config.schema.filament_change_extrusion_role_gcode]
type    = "string"
default = ""
group   = "Machine G-code"

[config.schema.process_change_extrusion_role_gcode]
type    = "string"
default = ""
group   = "Machine G-code"

# Canonical `GCode::process_layer` gates time-lapse injection on the printer's
# physical structure: `need_insert_timelapse_gcode_for_traditional` is
# `(is_i3_printer && !m_spiral_vase) || is_multi_extruder`, where `is_i3_printer`
# is `printer_structure == PrinterStructure::psI3`. Declared here rather than on
# the emitter because this module owns the `time_lapse_gcode` injection site.
[config.schema.printer_structure]
type    = "enum"
values  = ["undefine", "corexy", "i3", "hbot", "delta"]
default = "undefine"
display = "Printer Structure"
group   = "Machine G-code"

[config.schema.bed_temperature_initial_layer_single]
type    = "int"
default = 60
min     = 0
max     = 120
display = "Bed Temperature (Initial Layer)"
group   = "Machine G-code"

[config.schema.nozzle_temperature_initial_layer]
type    = "int"
default = 215
min     = 0
max     = 300
display = "Nozzle Temperature (Initial Layer)"
group   = "Machine G-code"

[config.schema.nozzle_diameter]
type        = "float"
default     = 0.4
min         = 0.1
max         = 2.0
unit        = "mm"
display     = "Nozzle diameter"
description = "OrcaSlicer coFloat key nozzle_diameter; exposed here so machine_start_gcode / machine_end_gcode templates can reference [nozzle_diameter] and have it substituted with the effective nozzle diameter. Bounds mirror the classic-perimeters declaration of the same key."
group       = "Machine G-code"

# P35 (ticket 42): static pressure-advance gate. Canonical `enable_pressure_advance`
# (`coBools` false) + `pressure_advance` (`coFloats` 0.02, max 2) are per-extruder
# vectors read at every `GCode.cpp` toolchange/start site; the port holds the
# scalar-global subset here (per-tool values ride the existing
# `tool_config:<idx>:` axis, Orca vector ingest rides ticket 125). Declared here
# to close ticket 04's ResolvedConfig-only contract; the decision point lives in
# the host emitter (`crates/slicer-gcode`), which reads the typed
# `ResolvedConfig` fields directly (P18 `disable_m73` precedent). The manifest
# default is dead for this class of key (see map Notes) — the macro default is
# what the module receives. Bounds mirror canonical (`min 0`, `max 2`); the port
# enforces them where canonical treats them as GUI hints (ticket 113 rule).
[config.schema.enable_pressure_advance]
type    = "bool"
default = false
display = "Enable pressure advance"
group   = "Machine G-code"
description = "OrcaSlicer coBools key enable_pressure_advance; when true the emitter prefixes the print and each toolchange with the flavor-specific pressure-advance command."

[config.schema.pressure_advance]
type    = "float"
default = 0.02
min     = 0.0
max     = 2.0
display = "Pressure advance"
group   = "Machine G-code"
description = "OrcaSlicer coFloats key pressure_advance (PA value for Klipper pressure advance / Marlin linear advance). Scalar-global subset; per-tool via tool_config axis, vector ingest rides ticket 125."

# P40 (ticket 47): flush temp/speed placeholder pair. Canonical
# `filament_flush_temp` (`coInts` nullable, default 0, max `max_temp` = 1500)
# + `filament_flush_volumetric_speed` (`coFloats` nullable, default 0,
# max 200) are per-filament vectors read at every `GCode.cpp`
# toolchange/placeholder site (`update_placeholder_parser_with_variant_params`,
# `set_extruder`, toolchange config builder) and published as the
# `flush_temperatures` / `flush_volumetric_speeds` placeholders for custom
# G-code; a 0 entry falls back to `nozzle_temperature_range_high` /
# `filament_max_volumetric_speed` (both Tier D deferred). The port holds the
# scalar-global subset here (per-tool via the `tool_config:<idx>:` axis,
# vector ingest rides ticket 125); `0`/`0.0` publish as-is with no fallback
# (ticket-47 DEV row). The generic placeholder sweep substitutes both keys
# into every template (`change_filament_gcode`, machine start/end); no
# key-specific `lib.rs` arm is needed (int/float render canonically, unlike
# word-form bools). Bounds mirror canonical; the port enforces them where
# canonical treats them as GUI hints (ticket 113 rule).
[config.schema.filament_flush_temp]
type    = "int"
default = 0
min     = 0
max     = 1500
display = "Flush temperature"
group   = "Machine G-code"
description = "OrcaSlicer coInts key filament_flush_temp (flush temperature in degC; 0 is inert, no fallback). Scalar-global subset; per-tool via tool_config axis, vector ingest rides ticket 125."

[config.schema.filament_flush_volumetric_speed]
type    = "float"
default = 0.0
min     = 0.0
max     = 200.0
display = "Flush volumetric speed"
group   = "Machine G-code"
description = "OrcaSlicer coFloats key filament_flush_volumetric_speed (flush volumetric speed in mm3/s; 0.0 is inert, no fallback). Scalar-global subset; per-tool via tool_config axis, vector ingest rides ticket 125."

# P43 (ticket 50): manual filament change. Canonical `manual_filament_change`
# (`coBool`, default false) omits the custom `change_filament_gcode` on the
# first toolchange (`GCode.cpp` toolchange path, `m_toolchange_count == 1`)
# for manual multi-material printing (M600/PAUSE driven); the toolchange tag
# line itself is emitted host-side by the serializer. Read here to gate the
# FilamentChange injection point.
[config.schema.manual_filament_change]
type    = "bool"
default = false
display = "Manual filament change"
group   = "Machine G-code"
description = "OrcaSlicer coBool key manual_filament_change; when true the first change_filament_gcode injection is skipped (manual swap via M600/PAUSE)."

[config.overridable-per-region]
keys = []

[config.overridable-per-layer]
keys = []

[hints]
estimated-ms-per-layer = 0
layer-parallel-safe    = true

[module]
id           = "com.core.skirt-brim"
version      = "0.1.0"
display-name = "Skirt Brim"
description  = "Core skirt brim module"
author       = "modular-slicer"
license      = "MIT"

[stage]
id = "PostPass::LayerFinalization"

[ir-access]
reads  = ["LayerCollectionIR"]
writes = ["LayerCollectionIR.skirt-brim"]

[claims]
holds    = []
requires = []

[compatibility]
incompatible-with = []
requires          = []
min-host-version  = "0.1.0"
min-ir-schema     = "1.0.0"
max-ir-schema     = "5.0.0"

[config.schema]
[config.schema.skirt_brim_enabled]
type    = "bool"
default = true
display = "Skirt/Brim Enabled"
group   = "Skirt/Brim"

[config.schema.skirt_loops]
type    = "int"
default = 6
min     = 0
max     = 20
display = "Skirt Loops"
group   = "Skirt/Brim"

[config.schema.skirt_distance]
type    = "float"
default = 3.0
min     = 0.0
max     = 20.0
display = "Skirt Distance"
group   = "Skirt/Brim"

[config.schema.skirt_height]
type    = "int"
default = 1
min     = 1
max     = 10
display = "Skirt Height"
group   = "Skirt/Brim"

[config.schema.brim_width]
type    = "float"
default = 8.0
min     = 0.0
max     = 30.0
display = "Brim Width"
group   = "Skirt/Brim"

[config.schema.line_width]
type    = "float"
default = 0.4
min     = 0
max     = 2.0
display = "Line Width"
group   = "Skirt/Brim"

# First-layer height: the brim/skirt flow spacing is
# `line_width - initial_layer_print_height x (1 - pi/4)` (canonical
# `Flow::rounded_rectangle_extrusion_spacing`). This is the host's typed
# `initial_layer_print_height`; declaring it here is what lets the module view
# carry it (module views expose declared keys only). The manifest default is
# documentation only — `ResolvedConfig` supplies the live value.
[config.schema.initial_layer_print_height]
type    = "float"
default = 0.2
min     = 0.01
max     = 1.0
display = "Initial Layer Height"
group   = "Skirt/Brim"

# Canonical `brim_object_gap` (OrcaSlicer default 0.1 mm): the brim ring starts
# this far outside the object outline.
[config.schema.brim_object_gap]
type    = "float"
default = 0.1
min     = 0.0
max     = 2.0
display = "Brim Object Gap"
group   = "Skirt/Brim"

# Canonical `min_skirt_length` (mm of filament). The port has no filament-flow
# model, so a non-zero value fails closed at construction instead of silently
# printing fewer loops than asked for. Author 0 (the canonical default) or
# raise `skirt_loops`.
[config.schema.min_skirt_length]
type    = "float"
default = 0.0
min     = 0.0
max     = 10000.0
display = "Minimum Skirt Length"
group   = "Skirt/Brim"

[hints]
estimated-ms-per-layer = 10
layer-parallel-safe    = false

[module]
id           = "com.core.wave-overhangs"
version      = "0.1.0"
display-name = "Wave Overhangs Bridge Fill"
description  = "Wave-overhang bridge fill: iterative inward wave contours over external bridge areas"
author       = "modular-slicer"
license      = "MIT"

[stage]
id = "Layer::Infill"

[ir-access]
reads  = ["SliceIR"]
writes = ["InfillIR"]

[claims]
# Bridge fill only. This module deliberately holds no sparse/top/bottom claim:
# it is selectable as the `bridge_fill_holder` alongside any sparse-fill module.
holds    = ["claim:bridge-fill"]
requires = []

[compatibility]
incompatible-with = []
requires          = []
min-host-version  = "0.1.0"
min-ir-schema     = "1.0.0"
max-ir-schema     = "5.0.0"

[config.schema]

# ── Wave-overhang generator keys (fork defaults) ────────────────────────
[config.schema.wave_overhang_pattern]
type    = "string"
default = "smart"
display = "Wave Overhang Pattern (smart, monotonic, zigzag)"
group   = "Wave Overhangs"

[config.schema.wave_overhang_line_spacing]
type    = "float"
default = 0.35
min     = 0.01
max     = 5.0
display = "Wave Overhang Line Spacing"
group   = "Wave Overhangs"

[config.schema.wave_overhang_perimeter_overlap]
type    = "float"
default = 0.1
min     = 0.0
max     = 5.0
display = "Wave Overhang Perimeter Overlap"
group   = "Wave Overhangs"

[config.schema.wave_overhang_minimum_width]
type    = "float"
default = 0.7
min     = 0.0
max     = 10.0
display = "Wave Overhang Minimum Width"
group   = "Wave Overhangs"

[config.schema.wave_overhang_min_new_area]
type    = "float"
default = 0.01
min     = 0.0
max     = 10.0
display = "Wave Overhang Minimum New Area"
group   = "Wave Overhangs"

[config.schema.wave_overhang_min_length]
type    = "float"
default = 0.0
min     = 0.0
max     = 100.0
display = "Wave Overhang Minimum Length"
group   = "Wave Overhangs"

[config.schema.wave_overhang_max_iterations]
type    = "int"
default = 0
min     = 0
max     = 500
display = "Wave Overhang Max Iterations (0 = unbounded)"
group   = "Wave Overhangs"

[config.schema.wave_overhang_flow_mm3_per_mm]
type    = "float"
default = 0.15
min     = 0.02
max     = 1.5
display = "Wave Overhang Flow (mm3/mm)"
group   = "Wave Overhangs"

[config.schema.wave_overhang_print_speed]
type    = "float"
default = 2.0
min     = 0.1
max     = 300.0
display = "Wave Overhang Print Speed"
group   = "Wave Overhangs"

[config.schema.wave_overhang_anchor_depth_mm]
type    = "float"
default = 0.0
min     = 0.0
max     = 20.0
display = "Wave Overhang Anchor Depth (mm)"
group   = "Wave Overhangs"

# ── Host/printer keys read by the generator ─────────────────────────────
[config.schema.bridge_speed]
type    = "float"
default = 25.0
min     = 1.0
max     = 300.0
display = "Bridge Speed"
group   = "Bridging"

[config.schema.bridge_line_width]
type    = "float"
default = 0.0
min     = 0.0
max     = 2.0
display = "Bridge Line Width"
group   = "Bridging"

[config.schema.bridge_flow]
type    = "float"
default = 1.0
min     = 0.0
display = "Bridge Flow"
group   = "Bridging"

[config.schema.bridge_density]
type    = "float_or_percent"
default = "100%"
min     = 10.0
max     = 120.0
display = "Bridge Density"
group   = "Bridging"

[config.schema.nozzle_diameter]
type    = "float"
default = 0.4
min     = 0.1
max     = 2.0
unit    = "mm"
display = "Nozzle diameter"
group   = "Printer"

[config.schema.wall_count]
type    = "int"
default = 3
min     = 1
max     = 10
display = "Wall Count"
group   = "Walls"

[config.schema.layer_height]
type    = "float"
default = 0.2
min     = 0.01
max     = 2.0
unit    = "mm"
display = "Layer height"
group   = "Quality"

[config.overridable-per-region]
keys = [
  "wave_overhang_pattern",
  "wave_overhang_line_spacing",
  "wave_overhang_perimeter_overlap",
  "wave_overhang_minimum_width",
  "wave_overhang_min_new_area",
  "wave_overhang_min_length",
  "wave_overhang_max_iterations",
  "wave_overhang_flow_mm3_per_mm",
  "wave_overhang_print_speed",
  "wave_overhang_anchor_depth_mm",
]

[config.overridable-per-layer]
keys = [
  "wave_overhang_pattern",
  "wave_overhang_line_spacing",
  "wave_overhang_perimeter_overlap",
  "wave_overhang_minimum_width",
  "wave_overhang_min_new_area",
  "wave_overhang_min_length",
  "wave_overhang_max_iterations",
  "wave_overhang_flow_mm3_per_mm",
  "wave_overhang_print_speed",
  "wave_overhang_anchor_depth_mm",
]

[hints]
estimated-ms-per-layer = 12
layer-parallel-safe    = true

[package]
name = "seam-placer"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Seam placement module implementing LayerModule for Layer::PerimetersPostProcess stage"

[features]
# Empty selection feature (default off); gates the crate-internal
# src/property_tests.rs unit-test module. Never enters a production or
# guest graph: also #[cfg(test)]-gated, and the property engine is a
# dev-dependency only.
property_testing = []

[dependencies]
slicer-sdk = { path = "../../../crates/slicer-sdk" }
slicer-schema = { path = "../../../crates/slicer-schema" }
slicer-ir = { path = "../../../crates/slicer-ir" }

[dev-dependencies]
slicer-sdk = { path = "../../../crates/slicer-sdk", features = ["test", "property_testing"] }
proptest = { workspace = true }

# Required by the `#[slicer_module]` macro's wasm32-only component export
# glue. On native builds the emitted `wit_bindgen::generate!` call is
# gated behind `#[cfg(target_arch = "wasm32")]` and never expanded.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[lints]
workspace = true

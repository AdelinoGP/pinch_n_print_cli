[module]
id           = "com.core.seam-placer"
version      = "0.1.0"
display-name = "Seam Placer"
description  = "Core seam placer module"
author       = "modular-slicer"
license      = "MIT"

[stage]
id = "Layer::PerimetersPostProcess"

[ir-access]
reads  = ["PerimeterIR"]
writes = ["PerimeterIR.resolved-seam", "PerimeterIR.regions.walls"]

[claims]
holds    = ["seam-placer"]
requires = []

[compatibility]
incompatible-with = []
requires          = []
min-host-version  = "0.1.0"
min-ir-schema     = "1.0.0"
max-ir-schema     = "5.0.0"

[config.schema]
[config.schema.seam_position]
type    = "enum"
values  = ["nearest", "rear", "random", "aligned", "aligned_back"]
default = "aligned"
display = "Seam Position"
group   = "Seam"

[config.overridable-per-region]
keys = []

[config.overridable-per-layer]
keys = []

[hints]
estimated-ms-per-layer = 10
layer-parallel-safe    = true

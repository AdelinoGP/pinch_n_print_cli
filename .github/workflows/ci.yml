name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      # Per-package formatting rather than `cargo fmt --all`: the aggregate
      # invocation exceeds the Windows command-line limit on this workspace, so
      # the two platforms would otherwise run different gates. See
      # `xtask/src/check_fmt.rs`.
      - run: cargo xtask check-fmt

  docs-guard:
    name: Docs staleness guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Numbered reference docs must not cite crate paths the project removed in
      # Packet 69 (slicer-host -> slicer-runtime, slicer-cli deleted) or the
      # top-level wit/ deleted in Packet 72. History/status docs are excluded:
      # 07_*, DEVIATION_LOG (legitimately describe the rename), and specs/.
      - name: Ban stale crate/binary/WIT paths in reference docs
        run: |
          set -euo pipefail
          files=$(ls docs/*.md | grep -Ev 'docs/(07_|DEVIATION_LOG)')
          # Dead paths: crates/slicer-host|cli/, slicer_host|cli::, bare `wit/<subdir>
          pattern='crates/slicer-(host|cli)/|slicer_(host|cli)::|`wit/(deps|world-|host-api|root)'
          if hits=$(grep -REn "$pattern" $files); then
            echo "::error::Stale crate/WIT path(s) found in reference docs. Use crates/slicer-runtime, crates/pnp-cli, or crates/slicer-schema/wit/. See docs/00_project_overview.md Code Map."
            echo "$hits"
            exit 1
          fi
          echo "OK: no stale crate/WIT paths in numbered reference docs."
      - name: Type Check
        run: cargo check --workspace
      - name: Deviation status + config docs in sync
        run: cargo run -q -p xtask -- check-deviations --check
      - name: Struct-literal gate
        run: cargo run -q -p xtask -- check-literals

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - name: Build guest WASMs
        run: cargo xtask build-guests
      - name: Test xtask
        run: cargo test -p xtask
      - name: Check guest freshness
        run: cargo xtask build-guests --check
      - name: Test Core (narrow)
        run: cargo test -p slicer-runtime --test contract core_module_ir_access_contract_tdd
      - name: Test All Crates (not workspace)
        # `--features perimeter-spatial-test-support` is required: packet 254's
        # `perimeter_spatial_capture` integration module is always compiled and
        # its only test without the feature is a guard that panics, so a
        # feature-less run fails loudly rather than reporting zero tests.
        run: cargo test -p slicer-runtime --features perimeter-spatial-test-support && cargo test -p pnp-cli && cargo test -p slicer-helpers

  dist-editions:
    name: Dist editions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - name: Dist developer edition (debug)
        run: cargo xtask dist --edition developer --debug
      - name: Dist hybrid edition (debug)
        run: cargo xtask dist --edition hybrid --debug
      # ADR-0056 disjointness invariant: an edition must never stage an
      # external copy of a module it integrates. Verify the staged artifact
      # matches the plan for both editions.
      - name: Verify edition disjointness invariant
        shell: sh
        run: |
          set -e
          for e in developer hybrid; do
            cargo xtask dist --edition "$e" --plan > "plan-$e.txt"
            for m in $(grep -P '^integrated\t' "plan-$e.txt" | cut -f2); do
              if [ -e "target/dist/$e/modules/$m" ]; then
                echo "::error::disjointness invariant violated: integrated module '$m' staged externally in edition '$e'"
                exit 1
              fi
            done
            staged=$(ls "target/dist/$e/modules" | wc -l)
            planned=$(grep -cP '^external\t' "plan-$e.txt")
            if [ "$staged" != "$planned" ]; then
              echo "::error::disjointness invariant violated: staged module dirs ($staged) != external plan lines ($planned) in edition '$e'"
              exit 1
            fi
          done
          echo "OK: disjointness invariant holds for developer and hybrid editions"

  properties-windows:
    name: Properties (Windows)
    runs-on: windows-latest
    # The budget covers a cold workspace compile on a fresh runner plus guest
    # WASM builds; the routine property run itself is short.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - name: Build guest WASMs
        run: cargo xtask build-guests
      - name: Run routine properties
        run: cargo xtask test --summary --properties --tier routine
      - name: Upload property failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: properties-windows-failure
          path: |
            target/test-output.log
            target/property-testing/
          if-no-files-found: ignore

  # Required lane for the scripted SCAD properties (packet
  # proptest-openrscad_04_pbt-scripted). It runs the same measured routine
  # profiles as the registry records ship with, through the enabled engine.
  #
  # The native Manifold kernel is a C++ CMake build, so CMake and MSVC must be
  # present before the enabled run; `windows-latest` provides both. Whole-process
  # supervision (`bounds.test_process_timeout_ms`) bounds every SCAD record's
  # libtest child, including recipe generation and shrink rendering.
  properties-scad-windows:
    name: Scripted SCAD properties (Windows)
    runs-on: windows-latest
    # A cold run compiles the vendored engine, its C++ kernel and the guest
    # WASMs; the selected routine properties themselves are seconds.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - name: Build guest WASMs
        run: cargo xtask build-guests
      - name: Run routine scripted SCAD properties
        shell: pwsh
        run: |
          # xtask owns the canonical combined log at target/test-output.log and
          # fails if it cannot create it; an outer Tee-Object to the same path
          # holds a sharing lock on Windows and aborts the run before any
          # property executes.
          cargo xtask test --summary --properties --tier routine --with-scad
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # An empty or unavailable selector is not acceptance: both records must
          # have produced a passing execution with completion evidence.
          if (-not (Select-String -Path target/test-output.log -Pattern 'D-SCAD-2D')) {
            Write-Host "::error::D-SCAD-2D did not execute"
            exit 1
          }
          if (-not (Select-String -Path target/test-output.log -Pattern 'D-SCAD-3D')) {
            Write-Host "::error::D-SCAD-3D did not execute"
            exit 1
          }
          exit 0
      - name: Upload scripted SCAD failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: properties-scad-windows-failure
          path: |
            target/test-output.log
            target/property-testing/
          if-no-files-found: ignore

  # Required lane for the SCAD adapter prerequisite (packet
  # proptest-openrscad_03_scad-adapter). It is self-contained: it does not depend
  # on the property-foundation job existing, and it runs its own feature-off and
  # enabled checks rather than deferring SCAD coverage to a final rollout.
  #
  # The engine is a vendored, patched subset of OpenRSCAD whose native Manifold
  # kernel is a C++ CMake build, so CMake and MSVC must be present before any
  # enabled step. Provenance and the classification table are in
  # `vendor/openrscad/PATCHES.md` and `docs/scad/openrscad-compatibility.md`.
  scad-adapter-windows:
    name: SCAD adapter (Windows)
    runs-on: windows-latest
    # A cold run compiles the vendored engine and its C++ kernel; the narrow
    # contract runs themselves are seconds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Record native prerequisites and toolchain identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/scad-adapter | Out-Null
          rustc -vV | Tee-Object -FilePath target/scad-adapter/rustc.txt
          cargo -V | Tee-Object -FilePath target/scad-adapter/cargo.txt
          cmake --version 2>&1 | Tee-Object -FilePath target/scad-adapter/cmake.txt
          where.exe cl 2>&1 | Tee-Object -FilePath target/scad-adapter/cl.txt
          (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\VisualStudio\SxS\VS7' -ErrorAction SilentlyContinue) | Out-String | Tee-Object -FilePath target/scad-adapter/vs7.txt
          git rev-parse HEAD | Tee-Object -FilePath target/scad-adapter/source_revision.txt
          git status --porcelain | Tee-Object -FilePath target/scad-adapter/dirty-content.txt
          exit 0

      - name: Dependency graph evidence (no engine, default features)
        shell: pwsh
        run: |
          cargo tree -p slicer-scad --no-default-features -e normal,build,features 2>&1 |
            Tee-Object -FilePath target/scad-adapter/tree-default.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The default graph must not reach the engine, its native kernel or the
          # font stack; the adapter's own source must not pull SDK/runtime/Proptest.
          $forbidden = 'openrscad|manifold-csg|rustybuzz|fontdb|slicer-sdk|slicer-runtime|proptest'
          $hits = Select-String -Path target/scad-adapter/tree-default.txt -Pattern $forbidden
          if ($hits) {
            Write-Host "::error::default slicer-scad graph reached a forbidden dependency"
            $hits | Out-String | Write-Host
            exit 1
          }
          exit 0

      - name: Feature-off contract (F)
        shell: pwsh
        run: |
          cargo test -p slicer-scad --no-default-features --test scad_feature_contract -- --nocapture 2>&1 |
            Tee-Object -FilePath target/test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/test-output.log target/scad-adapter/feature-off.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A green zero-test binary is not acceptance: prove the test ran.
          if (-not (Select-String -Path target/scad-adapter/feature-off.log -Pattern '1 passed')) {
            Write-Host "::error::feature-off contract did not execute a test"
            exit 1
          }

      - name: Dependency graph evidence (engine enabled)
        shell: pwsh
        run: |
          cargo tree -p slicer-scad --features openrscad -e normal,build,features 2>&1 |
            Tee-Object -FilePath target/scad-adapter/tree-enabled.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hits = Select-String -Path target/scad-adapter/tree-enabled.txt -Pattern 'slicer-sdk|slicer-runtime|proptest'
          if ($hits) {
            Write-Host "::error::enabled slicer-scad normal/build graph reached SDK, runtime or Proptest"
            $hits | Out-String | Write-Host
            exit 1
          }
          exit 0

      - name: Enabled engine identity contract (A)
        shell: pwsh
        run: |
          cargo test -p slicer-scad --features openrscad --test scad_feature_contract -- --nocapture 2>&1 |
            Tee-Object -FilePath target/test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/test-output.log target/scad-adapter/enabled-identity.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Adapter contracts (A)
        shell: pwsh
        run: |
          cargo test -p slicer-scad --features openrscad --test scad_adapter_contracts -- --nocapture 2>&1 |
            Tee-Object -FilePath target/test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/test-output.log target/scad-adapter/adapter-contracts.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Private classifier and conversion contracts (U)
        shell: pwsh
        run: |
          cargo test -p slicer-scad --features openrscad --lib -- scad_ --nocapture 2>&1 |
            Tee-Object -FilePath target/test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/test-output.log target/scad-adapter/private-contracts.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The filter must actually select tests; "0 filtered out / 0 passed" would
          # otherwise read as success.
          if (-not (Select-String -Path target/scad-adapter/private-contracts.log -Pattern 'scad_[a-z_]+ \.\.\. ok')) {
            Write-Host "::error::private scad_ tests did not execute"
            exit 1
          }

      - name: Process supervision and worker containment (L)
        shell: pwsh
        run: |
          cargo test -p slicer-scad --features openrscad --test scad_process_limits -- --nocapture 2>&1 |
            Tee-Object -FilePath target/test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/test-output.log target/scad-adapter/process-limits.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Narrow clippy
        shell: pwsh
        run: |
          cargo clippy -p slicer-scad --all-targets --features openrscad -- -D warnings 2>&1 |
            Tee-Object -FilePath target/scad-adapter/clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload adapter artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scad-adapter-windows
          path: |
            target/scad-adapter/
            target/test-output.log
          if-no-files-found: warn

  # Required lane for opt-in SCAD ingestion (packet
  # proptest-openrscad_05_scad-ingest). It runs real feature-off and enabled
  # library/import/slice acceptance rather than compile checks: the feature is
  # default-off, so a green default build alone proves nothing about it.
  #
  # The enabled run compiles the same vendored engine as the adapter lane, whose
  # native Manifold kernel is a C++ CMake build; `windows-latest` provides CMake
  # and MSVC. Guest WASMs are needed because the slice acceptance runs through
  # the gated `cargo xtask test` runner against in-tree core modules.
  scad-ingest-windows:
    name: SCAD ingestion (Windows)
    runs-on: windows-latest
    # A cold run compiles the vendored engine, its C++ kernel and the guest
    # WASMs; the narrow ingestion runs themselves are seconds.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - name: Build guest WASMs
        run: cargo xtask build-guests

      - name: Record provenance and native prerequisites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/scad-ingest | Out-Null
          # Rust/CMake provenance is load-bearing: an enabled run cannot be
          # interpreted without it, so a failing probe fails the step.
          rustc -vV 2>&1 | Tee-Object -FilePath target/scad-ingest/rustc.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::rustc -vV failed"; exit $LASTEXITCODE }
          cargo -V 2>&1 | Tee-Object -FilePath target/scad-ingest/cargo.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::cargo -V failed"; exit $LASTEXITCODE }
          cmake --version 2>&1 | Tee-Object -FilePath target/scad-ingest/cmake.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::CMake is required by the enabled SCAD engine and is missing"; exit $LASTEXITCODE }
          git rev-parse HEAD 2>&1 | Tee-Object -FilePath target/scad-ingest/source_revision.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::git rev-parse HEAD failed"; exit $LASTEXITCODE }
          git status --porcelain 2>&1 | Tee-Object -FilePath target/scad-ingest/dirty-content.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::git status failed"; exit $LASTEXITCODE }
          "CARGO_TARGET_DIR=$env:CARGO_TARGET_DIR" | Tee-Object -FilePath target/scad-ingest/target-env.txt
          "RUSTFLAGS=$env:RUSTFLAGS" | Tee-Object -FilePath target/scad-ingest/rustflags.txt
          # `cl` is normally absent from PATH on a healthy runner because the
          # developer prompt is what puts it there; its exit status is recorded
          # rather than enforced, since the enabled build below is the real check.
          where.exe cl 2>&1 | Tee-Object -FilePath target/scad-ingest/cl.txt
          "where.exe cl exit=$LASTEXITCODE" | Add-Content target/scad-ingest/cl.txt
          exit 0

      - name: Dependency graph isolation (default vs enabled)
        shell: pwsh
        run: |
          cargo tree -p pnp-cli -e normal,build,features 2>&1 |
            Tee-Object -FilePath target/scad-ingest/tree-pnp-cli-default.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo tree -p pnp-cli -e normal,build,features --features scad 2>&1 |
            Tee-Object -FilePath target/scad-ingest/tree-pnp-cli-scad.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo tree -p slicer-model-io -e normal,build,features 2>&1 |
            Tee-Object -FilePath target/scad-ingest/tree-model-io-default.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo tree -p slicer-model-io -e normal,build,features --features scad 2>&1 |
            Tee-Object -FilePath target/scad-ingest/tree-model-io-scad.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $defaultGraphs = @(
            'target/scad-ingest/tree-pnp-cli-default.txt',
            'target/scad-ingest/tree-model-io-default.txt')
          $defaultHits = Select-String -Path $defaultGraphs -Pattern 'slicer-scad|openrscad|manifold|proptest'
          if ($defaultHits) {
            Write-Host "::error::a default product graph reached the SCAD engine or Proptest"
            $defaultHits | Out-String | Write-Host
            exit 1
          }
          $enabledHits = Select-String -Path target/scad-ingest/tree-pnp-cli-scad.txt -Pattern 'proptest'
          if ($enabledHits) {
            Write-Host "::error::the enabled product graph reached Proptest"
            $enabledHits | Out-String | Write-Host
            exit 1
          }
          exit 0

      - name: Feature-off library contract (MF)
        shell: pwsh
        run: |
          cargo test -p slicer-model-io --no-default-features --test scad_ingest_feature_contract 2>&1 |
            Tee-Object -FilePath target/test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/test-output.log target/scad-ingest/MF-off.log
          if (-not (Select-String -Path target/scad-ingest/MF-off.log -Pattern 'scad_model_feature_routing \.\.\. ok')) {
            Write-Host "::error::MF-off did not execute scad_model_feature_routing"
            exit 1
          }
          if (-not (Select-String -Path target/scad-ingest/MF-off.log -Pattern 'scad_detection_is_case_insensitive_and_not_evaluation \.\.\. ok')) {
            Write-Host "::error::MF-off did not execute the detection test"
            exit 1
          }

      - name: Feature-off CLI contract (CF)
        shell: pwsh
        run: |
          cargo test -p pnp-cli --no-default-features --test scad_cli_feature_contract 2>&1 |
            Tee-Object -FilePath target/test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/test-output.log target/scad-ingest/CF-off.log
          if (-not (Select-String -Path target/scad-ingest/CF-off.log -Pattern 'scad_cli_feature_routing \.\.\. ok')) {
            Write-Host "::error::CF-off did not execute scad_cli_feature_routing"
            exit 1
          }
          if (-not (Select-String -Path target/scad-ingest/CF-off.log -Pattern 'test result: ok\. 1 passed')) {
            Write-Host "::error::CF-off did not run its single substantive test"
            exit 1
          }

      - name: Enabled library contract (MF + ME)
        shell: pwsh
        run: |
          cargo test -p slicer-model-io --features scad --test scad_ingest_feature_contract 2>&1 |
            Tee-Object -FilePath target/test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/test-output.log target/scad-ingest/MF-on.log
          if (-not (Select-String -Path target/scad-ingest/MF-on.log -Pattern 'scad_model_feature_routing \.\.\. ok')) {
            Write-Host "::error::MF-on did not execute scad_model_feature_routing"
            exit 1
          }
          cargo test -p slicer-model-io --features scad --test scad_model_ingest 2>&1 |
            Tee-Object -FilePath target/test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/test-output.log target/scad-ingest/ME.log
          $meTests = @(
            'scad_model_one_object_source_identity',
            'scad_model_explicit_holed_extrusion',
            'scad_model_rejects_dimensions_and_empty',
            'scad_model_preserves_strict_adapter_errors')
          foreach ($test in $meTests) {
            if (-not (Select-String -Path target/scad-ingest/ME.log -Pattern "$test \.\.\. ok")) {
              Write-Host "::error::ME did not execute $test"
              exit 1
            }
          }

      - name: Enabled CLI contract (CF)
        shell: pwsh
        run: |
          cargo test -p pnp-cli --features scad --test scad_cli_feature_contract 2>&1 |
            Tee-Object -FilePath target/test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/test-output.log target/scad-ingest/CF-on.log
          if (-not (Select-String -Path target/scad-ingest/CF-on.log -Pattern 'scad_cli_feature_routing \.\.\. ok')) {
            Write-Host "::error::CF-on did not execute scad_cli_feature_routing"
            exit 1
          }
          if (-not (Select-String -Path target/scad-ingest/CF-on.log -Pattern 'test result: ok\. 1 passed')) {
            Write-Host "::error::CF-on did not run its single substantive test"
            exit 1
          }

      - name: Bare-model placement (B)
        shell: pwsh
        run: |
          cargo test -p pnp-cli --features scad --bin pnp_cli -- scad_placement_ 2>&1 |
            Tee-Object -FilePath target/test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/test-output.log target/scad-ingest/B-placement.log
          $placementTests = @(
            'scad_placement_centers_and_drops_to_bed',
            'scad_placement_preserves_disconnected_offsets',
            'scad_placement_uses_configured_bed_centre',
            'scad_placement_leaves_3mf_untouched',
            'scad_placement_skips_when_bed_shape_is_unusable')
          foreach ($test in $placementTests) {
            if (-not (Select-String -Path target/scad-ingest/B-placement.log -Pattern "$test \.\.\. ok")) {
              Write-Host "::error::B did not execute $test"
              exit 1
            }
          }

      - name: Enabled import and slice acceptance (CE)
        shell: pwsh
        run: |
          # The gated runner owns the combined log, the literal and test-quality
          # preflights and the guest-freshness check; an outer Tee-Object to the
          # same path takes a sharing lock on Windows and aborts the run.
          cargo xtask test --summary -p pnp-cli --features pnp-cli/scad --test scad_cli_ingest -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/test-output.log target/scad-ingest/CE.log
          $ceTests = @(
            'scad_cli_import_preserves_source_coordinates',
            'scad_cli_holed_extrusion',
            'scad_cli_holed_extrusion_slices',
            'scad_cli_parameters_and_config_separation',
            'scad_cli_information_and_stats',
            'scad_cli_slice_places_and_emits',
            'scad_cli_rejects_option_misuse',
            'scad_cli_failures_do_not_publish',
            'scad_cli_strict_errors_and_resources',
            'scad_cli_supervisor_drains_large_stdout')
          foreach ($test in $ceTests) {
            if (-not (Select-String -Path target/scad-ingest/CE.log -Pattern "$test \.\.\. ok")) {
              Write-Host "::error::CE did not execute $test"
              exit 1
            }
          }

      - name: Ordinary STEP and CLI regressions
        shell: pwsh
        run: |
          $regressions = @(
            @{ Name = 'helpers_cli'; Package = 'pnp-cli'; Test = 'helpers_cli'; Expected = 9 },
            @{ Name = 'cli_tdd'; Package = 'pnp-cli'; Test = 'cli_tdd'; Expected = 3 },
            @{ Name = 'model_loader_tdd'; Package = 'slicer-model-io'; Test = 'model_loader_tdd'; Expected = 44 },
            @{ Name = 'bed_placement_tdd'; Package = 'slicer-model-io'; Test = 'bed_placement_tdd'; Expected = 8 })
          foreach ($case in $regressions) {
            cargo test -p $case.Package --test $case.Test 2>&1 |
              Tee-Object -FilePath target/test-output.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $log = "target/scad-ingest/$($case.Name).log"
            Copy-Item target/test-output.log $log
            # A green zero-test binary is not a regression pass: the expected
            # count must appear in the harness summary.
            if (-not (Select-String -Path $log -Pattern "test result: ok\. $($case.Expected) passed")) {
              Write-Host "::error::$($case.Name) did not report $($case.Expected) passing tests"
              exit 1
            }
          }

      - name: Narrow check and clippy
        shell: pwsh
        run: |
          # Both crates, both feature states: the cfg'd code has to compile and
          # lint clean without the feature too.
          cargo clippy -p slicer-model-io --all-targets -- -D warnings 2>&1 |
            Tee-Object -FilePath target/scad-ingest/clippy-model-io-default.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p slicer-model-io --all-targets --features scad -- -D warnings 2>&1 |
            Tee-Object -FilePath target/scad-ingest/clippy-model-io-scad.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p pnp-cli --all-targets --features scad -- -D warnings 2>&1 |
            Tee-Object -FilePath target/scad-ingest/clippy-pnp-cli-scad.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p pnp-cli --all-targets -- -D warnings 2>&1 |
            Tee-Object -FilePath target/scad-ingest/clippy-pnp-cli-default.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload ingestion artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scad-ingest-windows-failure
          path: |
            target/scad-ingest/
            target/test-output.log
          if-no-files-found: warn

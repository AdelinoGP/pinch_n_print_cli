[package]
name = "slicer-helpers"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
slicer-ir = { path = "../slicer-ir" }
nalgebra = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = "1.0"
meshopt = { workspace = true }
truck-stepio = { workspace = true }
truck-meshalgo = { workspace = true }

[dev-dependencies]
truck-modeling = { workspace = true }
truck-topology = "0.6"
criterion = { workspace = true }
# Bench fixtures are loaded through the production model loader so the
# benches exercise the same STL path as `pnp_cli mesh repair|decimate`.
slicer-model-io = { path = "../slicer-model-io" }

[[bench]]
name = "mesh_ops"
harness = false

[lints]
workspace = true

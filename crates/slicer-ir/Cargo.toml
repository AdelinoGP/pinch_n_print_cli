[package]
name = "slicer-ir"
version = "0.1.0"
edition = "2021"
authors = ["Pinch 'n Print Team"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
postcard = { workspace = true }
proptest = { workspace = true }
serde_json = "1.0"
slicer-sdk = { path = "../slicer-sdk", features = ["property_testing"] }
static_assertions = "1"

[features]
default = []
std = []
property_testing = []

[[test]]
name = "property_ir"
required-features = ["property_testing"]

[lints]
workspace = true

[package]
name = "slicer-gcode"
version = "0.1.0"
edition = "2021"
authors = ["Pinch 'n Print Team"]

[dependencies]
slicer-ir = { path = "../slicer-ir" }
slicer-helpers = { path = "../slicer-helpers" }
thiserror = "1.0"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "qoi"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "qoi"] }
slicer-sdk = { path = "../slicer-sdk", features = ["test"] }

[lints]
workspace = true

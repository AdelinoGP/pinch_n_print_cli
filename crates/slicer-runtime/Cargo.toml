[package]
name = "slicer-runtime"
version = "0.1.0"
edition = "2021"
authors = ["Pinch 'n Print Team"]

[features]
default = ["report"]
report = []

[dependencies]
slicer-ir = { path = "../slicer-ir" }
slicer-core = { path = "../slicer-core", features = ["host-algos"] }
slicer-sdk = { path = "../slicer-sdk" }
slicer-helpers = { path = "../slicer-helpers" }
slicer-scheduler = { path = "../slicer-scheduler" }
slicer-wasm-host = { path = "../slicer-wasm-host" }
slicer-integrated-modules = { path = "../slicer-integrated-modules", features = [
    "fuzzy-skin",
    "gyroid-infill",
    "infill-linker",
    "layer-planner-default",
    "lightning-infill",
    "overhang-classifier-default",
    "part-cooling",
    "rectilinear-infill",
    "seam-placer",
    "seam-planner-default",
    "skirt-brim",
    "support-surface-ironing",
    "top-surface-ironing",
    "traditional-support",
    "tree-support",
    "wipe-tower",
    "path-optimization-default",
    "machine-gcode-emit",
] }
slicer-gcode = { path = "../slicer-gcode" }
toml = "0.8"
rayon = "1.10"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
# `PNP_DUMP_PREPASS_IR` dumps struct-keyed IR maps that JSON cannot encode.
postcard = { workspace = true }
clap = { workspace = true, features = ["derive"] }
log = "0.4"
directories = "6"
rstar = "0.12"
png = "0.18"

[dev-dependencies]
wasmtime = { workspace = true }
slicer-model-io = { path = "../slicer-model-io" }
witness = { path = "../slicer-wasm-host/test-guests/witness" }
zip = { version = "2", default-features = false, features = ["deflate"] }
stl_io = "0.11"
wat = "1.0"
wit-parser = "0.247"
tempfile = "3"
serde_json = "1.0"
base64 = "0.22"
slicer_sdk = { package = "slicer-sdk", path = "../slicer-sdk", features = ["test"] }
slicer-schema = { path = "../slicer-schema" }
sdk-layer-infill-guest = { path = "../slicer-wasm-host/test-guests/sdk-layer-infill-guest" }
sdk-finalization-guest = { path = "../slicer-wasm-host/test-guests/sdk-finalization-guest" }
sdk-postpass-text-guest = { path = "../slicer-wasm-host/test-guests/sdk-postpass-text-guest" }
sdk-prepass-guest = { path = "../slicer-wasm-host/test-guests/sdk-prepass-guest" }
pnp-cli-locator = { path = "../pnp-cli-locator" }
criterion = { workspace = true }
toml = "0.8"
assert_cmd = "2"
predicates = "3"

# Fill-claim modules — the ONLY remaining module crate dev-dependencies.
# `infill_partitioned_input_tdd` is a cross-module contract test: a single
# fixture asserts that all three fill modules confine each role's paths to the
# host-partitioned polygon for that role. It is intentionally kept here (rather
# than split per-module) because the contract is shared across the three.
#
# Single-module SDK trait tests belong in the module's own `tests/` directory;
# host plumbing tests (blackboard, dispatch routing, claim dedup) load the
# module's `.wasm` and dispatch through wasmtime — neither needs a crate dep.
[dev-dependencies.rectilinear-infill]
path = "../../modules/core-modules/rectilinear-infill"

[dev-dependencies.gyroid-infill]
path = "../../modules/core-modules/gyroid-infill"

[dev-dependencies.lightning-infill]
path = "../../modules/core-modules/lightning-infill"

# ADR-0025: a `Layer::Infill` module's output is RAW segments, not valid infill.
# Per-role containment is only a property of the module + `Layer::InfillPostProcess`
# linker PAIR, so `infill_partitioned_input_tdd.rs` drives both.
[dev-dependencies.infill-linker]
path = "../../modules/core-modules/infill-linker"

[dev-dependencies.classic-perimeters]
path = "../../modules/core-modules/classic-perimeters"

# packet 204 (AC-5): integrated_parity_support_planner_tdd drives SupportPlanner
[dev-dependencies.tree-support-planner]
path = "../../modules/core-modules/tree-support-planner"

# packet 148 (AC-9): arachne_parity.rs drives ArachnePerimeters::run_perimeters
# natively (mirroring the module's own canonical tdd tests) instead of
# substring-matching its source text.
[dev-dependencies.arachne-perimeters]
path = "../../modules/core-modules/arachne-perimeters"

# packet 108: painted_seam_enforcer_blocker_tdd exercises
# seam-placer directly against classic-perimeters output.
[dev-dependencies.seam-placer]
path = "../../modules/core-modules/seam-placer"

[dev-dependencies.fuzzy-skin]
path = "../../modules/core-modules/fuzzy-skin"

[dev-dependencies.layer-planner-default]
path = "../../modules/core-modules/layer-planner-default"

[dev-dependencies.overhang-classifier-default]
path = "../../modules/core-modules/overhang-classifier-default"

[dev-dependencies.part-cooling]
path = "../../modules/core-modules/part-cooling"

[dev-dependencies.seam-planner-default]
path = "../../modules/core-modules/seam-planner-default"

[dev-dependencies.skirt-brim]
path = "../../modules/core-modules/skirt-brim"

[dev-dependencies.support-surface-ironing]
path = "../../modules/core-modules/support-surface-ironing"

[dev-dependencies.top-surface-ironing]
path = "../../modules/core-modules/top-surface-ironing"

[dev-dependencies.traditional-support]
path = "../../modules/core-modules/traditional-support"

[dev-dependencies.tree-support]
path = "../../modules/core-modules/tree-support"

[dev-dependencies.wipe-tower]
path = "../../modules/core-modules/wipe-tower"

[dev-dependencies.path-optimization-default]
path = "../../modules/core-modules/path-optimization-default"

[dev-dependencies.machine-gcode-emit]
path = "../../modules/core-modules/machine-gcode-emit"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "per_stage"
harness = false

[[bench]]
name = "wasm_modules"
harness = false

[[bench]]
name = "shell_classification"
harness = false

[[bench]]
name = "gate_evidence"
harness = false

[lints]
workspace = true

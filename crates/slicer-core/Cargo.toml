[package]
name = "slicer-core"
version = "0.1.0"
edition = "2021"
authors = ["Pinch 'n Print Team"]

[features]
default = []
host-algos = ["dep:rayon", "dep:boostvoronoi"]
# Opt-in only for the synthetic panic regression. Keeping this off the
# workspace's normal test feature set prevents boostvoronoi diagnostics from
# leaking into unrelated crates' test harnesses.
voronoi-panic-regression = ["boostvoronoi/console_debug"]

[dependencies]
clipper2-rust = { workspace = true }
log = "0.4"
rstar = "0.12"
rayon = { version = "1.10", optional = true }
boostvoronoi = { version = "0.12", optional = true }
slicer-ir = { path = "../slicer-ir" }
slicer-scheduler = { path = "../slicer-scheduler" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { workspace = true }
serde_json = "1"
slicer-model-io = { path = "../slicer-model-io" }

[[bench]]
name = "polygon_ops"
harness = false

[[test]]
name = "algo_mesh_analysis_tdd"
required-features = ["host-algos"]

[[test]]
name = "algo_lightning_tdd"
required-features = ["host-algos"]

[[test]]
name = "algo_prepass_slice_tdd"
required-features = ["host-algos"]

[[test]]
name = "algo_support_geometry_tdd"
required-features = ["host-algos"]

[[test]]
name = "algo_region_mapping_tdd"
required-features = ["host-algos"]

[[test]]
name = "overhang_annotation_ramp_tdd"
required-features = ["host-algos"]

[[test]]
name = "overhang_annotation_no_overhang_case"
required-features = ["host-algos"]

[[test]]
name = "medial_axis_golden_tdd"
required-features = ["host-algos"]

[[test]]
name = "medial_axis_degenerate_input_tdd"
required-features = ["host-algos"]

[[test]]
name = "medial_axis_determinism_tdd"
required-features = ["host-algos"]

[[test]]
name = "voronoi_stress"
required-features = ["host-algos"]

[[test]]
name = "voronoi_panic_regression"
required-features = ["host-algos", "voronoi-panic-regression"]

[[test]]
name = "flow_tdd"

[[test]]
name = "wall_sequence_reorder_tdd"

[[test]]
name = "sharp_corner_seam_threshold_tdd"

[[test]]
name = "bridge_over_infill_tdd"

[[test]]
name = "beading_distributed"
path = "tests/beading/distributed.rs"

[[test]]
name = "beading_redistribute"
path = "tests/beading/redistribute.rs"

[[test]]
name = "beading_widening"
path = "tests/beading/widening.rs"

[[test]]
name = "beading_outer_wall_inset"
path = "tests/beading/outer_wall_inset.rs"

[[test]]
name = "beading_limited"
path = "tests/beading/limited.rs"

[[test]]
name = "beading_factory"
path = "tests/beading/factory.rs"

[lints]
workspace = true

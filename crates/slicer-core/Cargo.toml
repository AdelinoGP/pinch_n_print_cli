[package]
name = "slicer-core"
version = "0.1.0"
edition = "2021"
authors = ["Pinch 'n Print Team"]

[features]
default = []
host-algos = ["dep:rayon", "dep:boostvoronoi"]
perimeter-spatial-test-support = []
# Opt-in only for the synthetic panic regression. Keeping this off the
# workspace's normal test feature set prevents boostvoronoi diagnostics from
# leaking into unrelated crates' test harnesses.
voronoi-panic-regression = ["boostvoronoi/console_debug"]
# Default-off owner feature for the registry-backed geometry properties
# (`property_geometry`, `property_geometry_controls`). It only selects test
# targets; the SDK/Proptest edges it relies on are dev-dependencies.
property_testing = []
# Scripted (SCAD-backed) geometry enrichment. Inert until its target exists;
# never part of `default` and never enabled by `property_testing`.
property_testing_scad = ["property_testing", "slicer-sdk/property_testing_scad"]

[dependencies]
# [t70 vendoring] Explicit path dep into the in-tree pristine copy of
# clipper2-rust 1.1.0 (vendor/clipper2-rust; registry archive sha256
# 0fd663fe..., provenance in
# docs/specs/perf-vs-orca/evidence/t70-clipper-candidate/vendor-provenance.json).
# Deliberately NOT `{ workspace = true }`: the guest freshness fingerprint
# walks `path` deps through Cargo.toml files and their `src/**`, so any
# engine source change marks every guest carrying slicer-core stale — a
# registry/version requirement would be invisible to that walk.
clipper2-rust = { path = "../../vendor/clipper2-rust" }
log = "0.4"
rstar = "0.12"
rayon = { version = "1.10", optional = true }
boostvoronoi = { version = "0.12", optional = true }
slicer-ir = { path = "../slicer-ir" }
# Region mapping re-resolves per-region configs through the typed scope
# resolver when a layer range covers the layer's top Z (packet
# `config-scope-resolution_09`). `slicer-config` depends on `slicer-ir` only,
# so this adds no cycle and compiles for `wasm32`.
slicer-config = { path = "../slicer-config" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
serde_json = "1"
slicer-model-io = { path = "../slicer-model-io" }
slicer-scheduler = { path = "../slicer-scheduler" }
# Dev-only on purpose. `cargo xtask build-guests --check` fingerprints a guest's
# Cargo path-dependency closure (normal, target-specific and build deps, including
# optional ones) and excludes dev-dependencies. An optional *normal* edge would
# put `slicer-scad` sources into every guest's fingerprint and mark all guests
# stale whenever the SCAD crate changes. `slicer-scad`'s default feature set is
# engine-free, so this unconditional dev-edge only costs a cheap compile in
# slicer-core test builds; the engine is reached solely through
# `slicer-sdk/property_testing_scad` (owner feature `property_testing_scad`).
slicer-scad = { path = "../slicer-scad" }
slicer-sdk = { path = "../slicer-sdk", features = ["property_testing"] }

[[bench]]
name = "polygon_ops"
harness = false


[package]
name = "slicer-scheduler"
version = "0.1.0"
edition = "2021"
authors = ["Pinch 'n Print Team"]

[dependencies]
slicer-config = { path = "../slicer-config" }
slicer-ir = { path = "../slicer-ir" }
slicer-schema = { path = "../slicer-schema" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
directories = "6"

[features]
default = []
# Empty selection feature: it only gates the `property_config` /
# `property_config_contracts` targets. It deliberately implies no engine,
# SCAD or host-algorithm feature; the native `slicer-sdk` dev-dependency
# supplies the harness and the shared domains.
property_testing = []

[dev-dependencies]
tempfile = "3"
serde_json = "1.0"
pnp-cli-locator = { path = "../pnp-cli-locator" }
proptest = { workspace = true }
slicer-sdk = { path = "../slicer-sdk", features = ["property_testing"] }

# Unique test binary names so they don't collide with slicer-runtime's
# `contract`/`integration`/`unit` buckets in target/debug/deps/ during a
# workspace test run.
[[test]]
name = "scheduler_contract"
path = "tests/contract/main.rs"

[[test]]
name = "scheduler_integration"
path = "tests/integration/main.rs"

[[test]]
name = "scheduler_unit"
path = "tests/unit/main.rs"

[[test]]
name = "region_split_manifest_tdd"
path = "tests/region_split_manifest_tdd.rs"

[[test]]
name = "region_split_aggregation_tdd"
path = "tests/region_split_aggregation_tdd.rs"

[[test]]
name = "region_split_plan_tdd"
path = "tests/region_split_plan_tdd.rs"

[[test]]
name = "property_config"
path = "tests/property_config.rs"
required-features = ["property_testing"]

[[test]]
name = "property_config_contracts"
path = "tests/property_config_contracts.rs"
required-features = ["property_testing"]

[lints]
workspace = true
